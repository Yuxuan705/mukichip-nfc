<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muki的转运小站✨</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #fcfcf0; 
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; font-family: sans-serif; -webkit-user-select: none;
        }
        .container {
            width: 100%; display: flex; flex-direction: column;
            align-items: center; padding-top: 4vh; padding-bottom: 80px; /* 底部留多一点空间防止被按钮挡住 */
        }
        .fortune-wrapper {
            width: 85%; max-width: 400px;
            filter: drop-shadow(0px 10px 20px rgba(0,0,0,0.15)); line-height: 0;
        }
        #fortune-img {
            width: 100%; height: auto; aspect-ratio: 9 / 16;
            object-fit: cover; border-radius: 12px; display: block;
        }
        .follow-link {
            margin-top: 15px; text-decoration: none; display: block;
            transition: transform 0.2s ease;
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.12));
            -webkit-tap-highlight-color: transparent;
        }
        .follow-link:active { transform: scale(0.92); }
        #follow-png { width: 300px; height: auto; display: block; }
        .footer { margin-top: 30px; font-size: 10px; color: #cccccc; }

        /* --- 🆕 新增：右下角悬浮按钮样式 --- */
        .float-game-btn {
            position: fixed; /* 固定在屏幕上，不随滚动条移动 */
            bottom: 30px;    /* 距离底部 30px */
            right: 20px;     /* 距离右边 20px */
            width: 120px;     /* 按钮大小 (可以自己改) */
            height: 70px;
            z-index: 999;    /* 保证在最上层 */
            
            /* 上下漂浮动画 */
            animation: bounce 2s infinite ease-in-out;
            transition: transform 0.2s;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.2));
            -webkit-tap-highlight-color: transparent;
        }

        .float-game-btn:active {
            transform: scale(0.9); /* 点击时缩小一点 */
        }

        .float-game-btn img {
            width: 100%; height: 100%;
            object-fit: contain; /* 保持图片比例 */
        }

        /* 漂浮动画关键帧 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); } /* 上移 10px */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="fortune-wrapper">
            <img id="fortune-img" src="" alt="Lucky Drawing">
        </div>
        <a href="https://www.instagram.com/yuxuantsuki/" class="follow-link">
            <img id="follow-png" src="Follow My IG.png" alt="Follow Me">
        </a>
        <div class="footer">Designed by @yuxuantsuki</div>
    </div>

    <a href="wheel.html" class="float-game-btn">
        <img src="game_btn.png" alt="Play Game">
    </a>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let picName = urlParams.get('p'); 
        const defaultImage = 'default.png'; 
        const fortuneImg = document.getElementById('fortune-img');

        if (picName) {
            fortuneImg.src = picName + '.png';
            fortuneImg.onerror = function() {
                this.src = defaultImage;
                this.onerror = null; 
            };
        } else {
            fortuneImg.src = defaultImage;
        }
    </script>
</body>
</html>
