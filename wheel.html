<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Muki's Lab 🧪</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">

    <style>
        /* --- 全局样式 --- */
        body {
            margin: 0; padding: 0;
            background-color: #fcfcf0;
            font-family: -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; 
            overflow-x: hidden;
            padding-bottom: 60px;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Coin 动态图样式 --- */
        .coin-header-img {
            width: 80px; 
            height: auto;
            margin-top: 40px; 
            margin-bottom: 15px; 
            animation: floatCoin 2s ease-in-out infinite;
        }

        @keyframes floatCoin {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* --- 标题样式 --- */
        h1 { 
            color: #333; 
            margin-top: 0; 
            font-size: 18px; 
            font-family: 'Silkscreen', cursive; 
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.5;
            white-space: nowrap; 
        }

        /* --- 转盘容器 --- */
        .wheel-container {
            position: relative;
            width: 320px; height: 320px;
            margin-top: 30px;
            margin-bottom: 20px;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
            -webkit-user-select: none; user-select: none;
        }

        /* --- 转盘本体 --- */
        #wheel {
            width: 100%; height: 100%;
            border-radius: 50%;
            position: relative;
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
            overflow: hidden;
        }

        /* --- 自定义设计图 --- */
        #my-wheel-design {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
            border-radius: 50%;
        }

        /* --- 指针 --- */
        .pointer {
            position: absolute;
            top: -20px; left: 50%;
            transform: translateX(-50%);
            width: 40px; auto; 
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* --- 中间按钮 (图片版) --- */
        .center-btn {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90px; height: 90px;
            object-fit: contain;
            cursor: pointer; z-index: 20;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
            transition: transform 0.1s;
        }
        .center-btn:active { transform: translate(-50%, -50%) scale(0.9); }

        /* --- IG 按钮区域 --- */
        .follow-link {
            margin-top: 40px;
            text-decoration: none; display: block;
            transition: transform 0.2s;
            filter: drop-shadow(0px 8px 15px rgba(0,0,0,0.1));
        }
        .follow-link:active { transform: scale(0.95); }
        
        #follow-png { width: 300px; height: auto; display: block; }
        
        .footer { 
            margin-top: 30px; font-size: 10px; color: #ccc; 
            font-family: 'Silkscreen', cursive;
        }

        /* --- 弹窗样式 --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 999;
            display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s;
        }
        .modal-content {
            width: 85%; max-width: 380px;
            background: transparent; text-align: center; position: relative;
        }
        #result-img {
            width: 100%; border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: block;
        }
        
        /* --- 弹窗关闭按钮 --- */
        .close-btn {
            margin-top: 25px; padding: 12px 30px;
            background: #fff; 
            color: #333;
            border-radius: 8px;
            border: 3px solid #333;
            font-family: 'Silkscreen', cursive;
            font-size: 14px; 
            cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            text-transform: uppercase;
        }
        .close-btn:active { transform: scale(0.95); background: #eee; }
    </style>
</head>
<body>

    <img src="insert_coin.gif" alt="Insert Coin" class="coin-header-img">

    <h1>INSERT COIN TO START</h1>

    <div class="wheel-container">
        <img src="https://cdn-icons-png.flaticon.com/512/25/25623.png" class="pointer" style="width: 30px; top:-15px; filter: invert(1);">

        <div id="wheel">
            <img id="my-wheel-design" src="wheel_design.png" alt="My Wheel">
        </div>

        <img src="game_btn.png" class="center-btn" onclick="spinWheel()" alt="GO">
    </div>

    <a href="https://www.instagram.com/yuxuantsuki/" class="follow-link">
        <img id="follow-png" src="Follow My IG.png" alt="Follow Me">
    </a>

    <div class="footer">DESIGNED BY @YUXUANTSUKI</div>

    <div id="modal-overlay">
        <div class="modal-content">
            <img id="result-img" src="" alt="Result">
            <button class="close-btn" onclick="closeModal()">CLAIM REWARD</button>
        </div>
    </div>

    <script>
        let currentRotation = 0;
        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            const wheel = document.getElementById('wheel');
            
            // 随机旋转度数
            const randomDeg = Math.floor(Math.random() * 360);
            const extraSpins = 360 * 5; // 多转5圈
            const totalDeg = currentRotation + extraSpins + randomDeg;
            
            wheel.style.transform = `rotate(${totalDeg}deg)`;
            currentRotation = totalDeg;

            // 4秒后计算结果
            setTimeout(() => {
                isSpinning = false;
                calculateResult(totalDeg);
            }, 4000);
        }

        // 🆕 核心修正：按照你的图片角度精确计算
        function calculateResult(finalAngle) {
            // 1. 算出转盘最后停在哪个角度 (相对于0度)
            // 为什么要用 360 - ...? 因为转盘是顺时针转，但角度坐标是逆时针分布的
            let actualDeg = (360 - (finalAngle % 360)) % 360;
            
            let category = '';

            // 2. 根据你的设计图进行区间判断
            // Love (人缘): 跨越 0 度 (330-360 和 0-30)
            if (actualDeg >= 330 || actualDeg < 30) {
                category = 'Love';
            } 
            // Wealth (财富): 30-90
            else if (actualDeg >= 30 && actualDeg < 90) {
                category = 'Wealth';
            } 
            // Health (健康): 90-150
            else if (actualDeg >= 90 && actualDeg < 150) {
                category = 'Health';
            } 
            // Lucky (幸运): 150-210
            else if (actualDeg >= 150 && actualDeg < 210) {
                category = 'Lucky';
            } 
            // Career (事业): 210-270
            else if (actualDeg >= 210 && actualDeg < 270) {
                category = 'Career';
            } 
            // Secret (隐藏): 270-330
            else if (actualDeg >= 270 && actualDeg < 330) {
                category = 'Secret';
            }

            console.log("最终角度: " + actualDeg + "° -> 结果: " + category);
            showResult(category);
        }

        function showResult(category) {
            const randomNum = Math.floor(Math.random() * 50) + 1;
            const fileName = category + '_' + randomNum + '.png';
            const modal = document.getElementById('modal-overlay');
            const img = document.getElementById('result-img');
            img.src = fileName;
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('modal-overlay');
            modal.style.opacity = '0';
            setTimeout(() => { modal.style.display = 'none'; }, 300);
        }
    </script>

</body>
</html>
